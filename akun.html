<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0d2b"><title>Akun – CraftNusa</title><link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div id="hdr"></div>
<div class="page"><div class="w"><h1>Akun saya</h1><p>Kelola profil dan hubungi staf lewat tiket bantuan.</p></div></div>
<section><div class="w"><div id="msg"></div><div id="app" hidden>
<div class="box me"><img class="av" id="av" alt="" hidden><div style="flex:1;min-width:180px"><b id="nm" class="px" style="font-size:20px"></b><div id="via" style="color:var(--mu)"></div></div><button class="btn d" id="out" type="button">Keluar</button></div>
<div class="grid" style="margin-top:22px;align-items:start">
<div class="box" style="padding:20px"><h3 style="margin-bottom:14px">Profil Minecraft</h3><label class="field"><span>Nickname Minecraft</span><input id="mc" maxlength="16" placeholder="contoh: Steve_123"></label><button class="btn full" id="sv" type="button">Simpan</button></div>
<div class="box" style="padding:20px"><h3 style="margin-bottom:14px">Tiket bantuan</h3><form id="tf"><label class="field"><span>Judul</span><input id="ts" maxlength="120" required></label><label class="field"><span>Pesan</span><textarea id="tm" maxlength="2000" required placeholder="Ceritakan masalahmu sejelas mungkin"></textarea></label><button class="btn g full" type="submit">Kirim tiket</button></form></div>
</div>
<div class="h" style="margin-top:36px"><h2>Tiket saya</h2></div><div id="tl"><div style="color:var(--mu)">Memuat…</div></div>
</div></div></section>
<div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script><script>
var $m=$("msg");function note(t,c){$m.innerHTML=t?"<div class='alert "+c+"'>"+esc(t)+"</div>":""}
if(!sb){note("Login belum dihubungkan. Isi supabaseUrl dan supabaseKey di config.js (lihat README.md).","info")}
else sb.auth.getSession().then(function(r){var s=r.data.session;if(!s){location.href="login.html";return}start(s.user)});
function start(u){
 var md=u.user_metadata||{},prov=(u.app_metadata&&u.app_metadata.provider)||"email";
 $("app").hidden=false;
 $("nm").textContent=md.full_name||md.name||md.mc_name||u.email||"Pemain";
 $("via").textContent=(prov=="discord"?"Masuk lewat Discord":"Masuk lewat email")+(u.email?" · "+u.email:"");
 if(md.avatar_url){$("av").src=md.avatar_url;$("av").hidden=false}
 sb.from("profiles").select("mc_name").eq("id",u.id).maybeSingle().then(function(r){if(r.data&&r.data.mc_name)$("mc").value=r.data.mc_name});
 $("sv").onclick=function(){var v=$("mc").value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(v))return note("Nickname 3–16 karakter: huruf, angka, atau garis bawah.","err");
  sb.from("profiles").upsert({id:u.id,mc_name:v}).then(function(r){if(r.error)return note(/duplicate|unique/i.test(r.error.message)?"Nickname itu sudah dipakai akun lain.":r.error.message,"err");note("Profil disimpan.","ok");toast("Tersimpan!")})};
 $("out").onclick=function(){sb.auth.signOut().then(function(){location.href="index.html"})};
 $("tf").onsubmit=function(e){e.preventDefault();var s=$("ts").value.trim(),m=$("tm").value.trim();if(!s||!m)return;
  sb.from("tickets").insert({subject:s,message:m}).then(function(r){if(r.error)return note(r.error.message,"err");$("ts").value=$("tm").value="";note("Tiket terkirim. Staf akan membalas lewat Discord atau email.","ok");loadT()})};
 function loadT(){sb.from("tickets").select("id,subject,status,created_at").order("created_at",{ascending:false}).then(function(r){
  var d=r.data||[];$("tl").innerHTML=d.length?d.map(function(t){return"<div class='box tk'><b>"+esc(t.subject)+"</b><small>#"+t.id+" · "+esc(t.status=="open"?"Terbuka":"Selesai")+" · "+new Date(t.created_at).toLocaleDateString("id-ID")+"</small></div>"}).join(""):"<div style='color:var(--mu)'>Belum ada tiket.</div>"})}
 loadT()}</script></body></html>
